name: CI/CD

on:
  # Solo se lanza al hacer merge a main (push). No corre en PRs ni pushes a develop.
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Lint + Typecheck + Unit Tests ─────────────────────────────────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test -- --run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

  # ─── Deploy a Vercel (production) ───────────────────────────────────────────
  # Solo en push a main y SOLO después de que quality (lint+typecheck+unit)
  # y build hayan pasado. No construimos con Vercel CLI --prebuilt: eso hornea
  # las env vars del runner y produjo el fallo en producción. En su lugar
  # disparamos el Deploy Hook (webhook) de Vercel para que Vercel construya y
  # despliegue con SUS propias env vars del dashboard.
  # Requiere: (1) en Vercel → Settings → Deploy Hooks, crear un hook y guardar
  # su URL en el secret VERCEL_DEPLOY_HOOK de GitHub; (2) dejar el "Ignored
  # Build Step" en `exit 0` (skip siempre) para que la integración git de Vercel
  # NUNCA despliegue por su cuenta (ver CLAUDE.md §13).
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"